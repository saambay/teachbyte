name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teachbyte
          POSTGRES_PASSWORD: teachbyte
          POSTGRES_DB: teachbyte
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teachbyte"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma client
        run: npx --workspace=server prisma generate

      - name: Run migrations
        run: npx --workspace=server prisma migrate deploy
        env:
          DATABASE_URL: postgresql://teachbyte:teachbyte@localhost:5432/teachbyte

      - name: Run server tests
        run: npm run test --workspace=server
        env:
          DATABASE_URL: postgresql://teachbyte:teachbyte@localhost:5432/teachbyte
          LLM_PROVIDER: mock
          JWT_SECRET: test-secret
          NODE_ENV: test

      - name: Type check mobile
        run: npx --workspace=apps/mobile tsc --noEmit
